<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishan // Profile</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1a1a1e;
            --border-color: #ffb6c1;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent-pink: #ffb6c1;
            --accent-pink-glow: rgba(255, 182, 193, 0.15);
            --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-mono);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 680px;
            padding: 20px;
        }

        /* Signature Pink Board */
        .card {
            background-color: var(--panel-bg);
            border: 2px solid var(--accent-pink);
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 0 25px var(--accent-pink-glow);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 20px;
            background: var(--bg-color);
            padding: 0 10px;
            font-size: 0.85rem;
            color: var(--accent-pink);
            letter-spacing: 1px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24.
            border-bottom: 1px solid rgba(255, 182, 193, 0.2);
            padding-bottom: 20px;
        }

        .identity h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .identity p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .elo-badge {
            background: var(--accent-pink-glow);
            border: 1px solid var(--accent-pink);
            color: var(--accent-pink);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 182, 193, 0.15);
            padding: 16px;
            border-radius: 6px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 1.1rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .terminal-output {
            background: #0d0d0f;
            border-left: 3px solid var(--accent-pink);
            padding: 14px 16px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-radius: 0 6px 6px 0;
        }

        .terminal-output span {
            color: var(--accent-pink);
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="header">
                <div class="identity">
                    <h1>Ishan</h1>
                    <p>~/profile/main</p>
                </div>
                <div class="elo-badge">
                    ELO 1650
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Core Focus</div>
                    <div class="stat-value">Systems & Engineering</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Environment</div>
                    <div class="stat-value">Linux Terminal</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Primary Stack</div>
                    <div class="stat-value">C++ / C# / Rust</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Status</div>
                    <div class="stat-value" style="color: #4ade80;">● Active</div>
                </div>
            </div>

            <div class="terminal-output">
                <span>ishan@system:~$</span> ./load_stats.sh --rating=1650 --status=optimal
            </div>
        </div>
    </div>

</body>
